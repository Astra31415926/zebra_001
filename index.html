<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TAINA · DEBUG SCANNER</title>
<style>
:root {
  --bg: #050507;
  --panel: #0c0c12;
  --border: #1a1a26;
  --text: #8888a0;
  --dim: #444460;
  --accent: #3a7aaa;
  --green: #2a8a3a;
  --warn: #8a7010;
  --red: #8a2020;
  --mono: 'Courier New', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 100dvh;
  overflow: hidden;
}

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  flex-shrink: 0;
}
.logo { font-size: 13px; letter-spacing: 2px; color: var(--accent); font-weight: bold; }
.badge {
  font-size: 10px; letter-spacing: 1px; padding: 3px 8px;
  border: 1px solid var(--border); border-radius: 4px; color: var(--dim);
}
.timer { margin-left: auto; font-size: 13px; font-weight: bold; color: var(--dim); }

/* ── LAYOUT: горизонталь на ПК, вертикаль на мобильном ── */
.workspace {
  display: flex;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}

/* ЛЕВАЯ ПАНЕЛЬ: превью */
.panel-preview {
  display: flex;
  flex-direction: column;
  width: 55%;
  min-width: 0;
  border-right: 1px solid var(--border);
}

/* Область видео/изображения */
.viewport {
  position: relative;
  flex: 1;
  background: #000;
  overflow: hidden;
  min-height: 0;
}
#video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  display: none;
}
#canvas-preview {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: contain;
  image-rendering: pixelated;
}
/* Видоискатель */
#viewfinder {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 65%; aspect-ratio: 1;
  pointer-events: none;
  display: none;
}
#viewfinder span {
  position: absolute;
  width: 22px; height: 22px;
  border: 2px solid rgba(58,122,170,0.8);
}
#viewfinder span:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
#viewfinder span:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
#viewfinder span:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
#viewfinder span:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }

/* Оверлей для маркеров углов */
#overlay {
  position: absolute; inset: 0;
  pointer-events: none;
}

/* Статус */
.status-bar {
  padding: 8px 12px;
  font-size: 11px;
  border-top: 1px solid var(--border);
  background: #08080c;
  min-height: 34px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--dim); flex-shrink: 0;
}
.status-dot.ok { background: #2a8a3a; box-shadow: 0 0 6px #2a8a3a; }
.status-dot.warn { background: #8a7010; }
.status-dot.err { background: #8a2020; }
#status-text { letter-spacing: .5px; }

/* Кнопки управления */
.controls {
  display: flex;
  gap: 8px;
  padding: 10px 12px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
button, label.btn {
  flex: 1;
  padding: 12px 8px;
  background: #10101a;
  border: 1px solid var(--border);
  color: var(--text);
  font: 12px/1 var(--mono);
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 4px;
  text-align: center;
  transition: border-color .15s, color .15s;
}
button:hover, label.btn:hover { border-color: var(--accent); color: #fff; }
button:disabled { opacity: .3; cursor: not-allowed; }
button.active { border-color: var(--accent); color: var(--accent); }
input[type=file] { display: none; }

/* ПРАВАЯ ПАНЕЛЬ: диагностика */
.panel-log {
  display: flex;
  flex-direction: column;
  width: 45%;
  min-width: 0;
}

/* Табы */
.tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  flex-shrink: 0;
}
.tab {
  flex: 1;
  padding: 10px 4px;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--dim);
  cursor: pointer;
  border: none;
  background: transparent;
  border-bottom: 2px solid transparent;
  transition: color .15s;
  font-family: var(--mono);
}
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }

/* Лог */
.log-area {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px;
  font-size: 11px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-all;
}
.log-area::-webkit-scrollbar { width: 4px; }
.log-area::-webkit-scrollbar-track { background: transparent; }
.log-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.lh { color: #3a7aaa; font-weight: bold; }
.lok { color: #2a8a3a; }
.lw { color: #8a7010; }
.le { color: #8a2020; }
.li { color: #555570; }
.lv { color: #6a5aa0; }

/* RGB канали */
.rgb-panel { display: none; flex: 1; flex-direction: column; }
.rgb-panel.on { display: flex; }
.rgb-row {
  display: flex; flex: 1; min-height: 0;
}
.rgb-cell {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px;
  gap: 6px;
  border-right: 1px solid var(--border);
}
.rgb-cell:last-child { border-right: 0; }
.rgb-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
.rgb-canvas-wrap {
  width: 100%; flex: 1; min-height: 0;
  display: flex; align-items: center; justify-content: center;
}
.rgb-canvas-wrap canvas {
  max-width: 100%; max-height: 100%;
  image-rendering: pixelated;
  border: 1px solid var(--border);
}
.rgb-result {
  font-size: 10px; color: var(--dim); text-align: center;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}

/* ── МОБИЛЬНЫЙ: вертикально ── */
@media (max-width: 700px) {
  body { overflow: auto; }
  .workspace { flex-direction: column; overflow: visible; height: auto; }
  .panel-preview { width: 100%; border-right: 0; border-bottom: 1px solid var(--border); }
  .panel-log { width: 100%; }
  .viewport { aspect-ratio: 1; flex: none; height: auto; }
  canvas#canvas-preview { position: static; width: 100% !important; height: auto !important; }
  .log-area { max-height: 50vh; }
}

/* Результат внизу */
.result-bar {
  padding: 10px 14px;
  border-top: 2px solid var(--border);
  background: #08080e;
  font-size: 13px;
  font-weight: bold;
  color: var(--green);
  letter-spacing: .5px;
  min-height: 38px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 8px;
}
.result-bar.fail { color: var(--red); }
</style>
</head>
<body>

<header>
  <span class="logo">TAINA·DEBUG</span>
  <span class="badge">v1.0</span>
  <span class="timer" id="timer">--:--</span>
</header>

<div class="workspace">

  <!-- ЛЕВАЯ: превью -->
  <div class="panel-preview">
    <div class="viewport" id="viewport">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas-preview"></canvas>
      <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="viewfinder">
        <span></span><span></span><span></span><span></span>
      </div>
    </div>
    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span id="status-text">Очікування команди...</span>
    </div>
    <div class="controls">
      <button id="btn-cam">📷 Камера</button>
      <label class="btn">🖼 Файл<input type="file" id="file-in" accept="image/*"></label>
      <button id="btn-clear">✕ Очист</button>
    </div>
  </div>

  <!-- ПРАВАЯ: диагностика -->
  <div class="panel-log">
    <div class="tabs">
      <button class="tab on" id="tab-diag">Діагностика</button>
      <button class="tab" id="tab-rgb">RGB-канали</button>
    </div>
    <div class="log-area" id="log-diag"></div>
    <div class="rgb-panel" id="rgb-panel">
      <div class="rgb-row">
        <div class="rgb-cell">
          <span class="rgb-label" style="color:#ff5060">R</span>
          <div class="rgb-canvas-wrap"><canvas id="cv-r" width="200" height="200"></canvas></div>
          <div class="rgb-result" id="res-r">—</div>
        </div>
        <div class="rgb-cell">
          <span class="rgb-label" style="color:#35d96a">G</span>
          <div class="rgb-canvas-wrap"><canvas id="cv-g" width="200" height="200"></canvas></div>
          <div class="rgb-result" id="res-g">—</div>
        </div>
        <div class="rgb-cell">
          <span class="rgb-label" style="color:#4b8dff">B</span>
          <div class="rgb-canvas-wrap"><canvas id="cv-b" width="200" height="200"></canvas></div>
          <div class="rgb-result" id="res-b">—</div>
        </div>
      </div>
    </div>
  </div>

</div>

<div class="result-bar" id="result-bar">Результат з'явиться тут...</div>

<script>
'use strict';

// ─── ТАЙМЕР ───────────────────────────────────────────────
const timerEl = document.getElementById('timer');
let _start = Date.now();
setInterval(() => {
  const s = Math.floor((Date.now() - _start) / 1000);
  timerEl.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
}, 500);

// ─── ЛОГ ──────────────────────────────────────────────────
const logEl = document.getElementById('log-diag');
function addLog(msg, cls='li') {
  const now = new Date();
  const ts = [now.getHours(),now.getMinutes(),now.getSeconds()]
    .map(v=>String(v).padStart(2,'0')).join(':') + '.' + String(now.getMilliseconds()).padStart(3,'0');
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = '['+ts+'] ' + msg;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
}
const Lh = m => addLog('═══ ' + m, 'lh');
const Lok = m => addLog('✓ ' + m, 'lok');
const Lw  = m => addLog('⚠ ' + m, 'lw');
const Le  = m => addLog('✗ ' + m, 'le');
const Li  = m => addLog('  ' + m, 'li');
const Lv  = m => addLog('· ' + m, 'lv');
const clrLog = () => { logEl.innerHTML = ''; };

// ─── СТАТУС ───────────────────────────────────────────────
const dotEl = document.getElementById('status-dot');
const stEl  = document.getElementById('status-text');
function setSt(txt, state='idle') {
  stEl.textContent = txt;
  dotEl.className = 'status-dot' + (state==='ok'?' ok':state==='warn'?' warn':state==='err'?' err':'');
}

// ─── ТАБЫ ─────────────────────────────────────────────────
const tabDiag = document.getElementById('tab-diag');
const tabRGB  = document.getElementById('tab-rgb');
const logDiag = document.getElementById('log-diag');
const rgbPanel= document.getElementById('rgb-panel');
tabDiag.onclick = () => {
  tabDiag.classList.add('on'); tabRGB.classList.remove('on');
  logDiag.style.display=''; rgbPanel.classList.remove('on');
};
tabRGB.onclick = () => {
  tabRGB.classList.add('on'); tabDiag.classList.remove('on');
  logDiag.style.display='none'; rgbPanel.classList.add('on');
};

// ─── CANVAS PREVIEW + OVERLAY ─────────────────────────────
const cvPrev   = document.getElementById('canvas-preview');
const ctxPrev  = cvPrev.getContext('2d');
const svgOvl   = document.getElementById('overlay');
const viewport = document.getElementById('viewport');

function clearOverlay() { svgOvl.innerHTML = ''; }

// Отображаем изображение на canvas и масштабируем overlay
function showImage(px, w, h) {
  cvPrev.width = w; cvPrev.height = h;
  const idata = ctxPrev.createImageData(w, h);
  idata.data.set(px);
  ctxPrev.putImageData(idata, 0, 0);
}

// Нарисовать маркеры углов + рамку
function drawCorners(corners, imgW, imgH, label, color) {
  if (!corners) return;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;

  // Вычислить масштаб canvas→viewport (object-fit: contain)
  const scaleX = vw / imgW, scaleY = vh / imgH;
  const scale  = Math.min(scaleX, scaleY);
  const ox = (vw - imgW * scale) / 2;
  const oy = (vh - imgH * scale) / 2;
  const tx = x => ox + x * scale;
  const ty = y => oy + y * scale;

  const {TL, TR, BR, BL} = corners;

  // Полигон рамки
  const pts = [TL, TR, BR, BL].map(([x,y]) => `${tx(x).toFixed(1)},${ty(y).toFixed(1)}`).join(' ');
  const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  poly.setAttribute('points', pts);
  poly.setAttribute('fill','none');
  poly.setAttribute('stroke', color);
  poly.setAttribute('stroke-width','1.5');
  poly.setAttribute('stroke-dasharray','6,4');
  poly.setAttribute('opacity','0.85');
  svgOvl.appendChild(poly);

  // Маркеры углов
  const labels = ['TL','TR','BR','BL'];
  [TL, TR, BR, BL].forEach(([x, y], i) => {
    const cx = tx(x), cy = ty(y);
    // Крест
    const lsz = 8;
    ['M'+[cx-lsz,cy]+' L'+[cx+lsz,cy], 'M'+[cx,cy-lsz]+' L'+[cx,cy+lsz]].forEach(d => {
      const line = document.createElementNS('http://www.w3.org/2000/svg','path');
      line.setAttribute('d', d);
      line.setAttribute('stroke', color);
      line.setAttribute('stroke-width','2');
      svgOvl.appendChild(line);
    });
    // Кружок
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx', cx); circle.setAttribute('cy', cy);
    circle.setAttribute('r','5');
    circle.setAttribute('fill', color); circle.setAttribute('opacity','0.7');
    svgOvl.appendChild(circle);
    // Подпись
    const text = document.createElementNS('http://www.w3.org/2000/svg','text');
    text.setAttribute('x', cx + (i===1||i===2? 8:-22));
    text.setAttribute('y', cy + (i>=2? 16:-6));
    text.setAttribute('fill', color);
    text.setAttribute('font-size','10');
    text.setAttribute('font-family','Courier New, monospace');
    text.textContent = labels[i];
    svgOvl.appendChild(text);
  });

  // Лейбл рамки
  if (label) {
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    const [bx, by] = TL;
    t.setAttribute('x', tx(bx) + 4);
    t.setAttribute('y', ty(by) - 5);
    t.setAttribute('fill', color);
    t.setAttribute('font-size','11');
    t.setAttribute('font-family','Courier New, monospace');
    t.setAttribute('font-weight','bold');
    t.textContent = label;
    svgOvl.appendChild(t);
  }
}

// Нарисовать bounding box (x0,y0,w,h)
function drawBox(box, imgW, imgH, label, color) {
  if (!box) return;
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  const scale = Math.min(vw/imgW, vh/imgH);
  const ox = (vw - imgW*scale)/2, oy = (vh - imgH*scale)/2;
  const T = (x,y) => [ox+x*scale, oy+y*scale];
  const [x0,y0] = T(box.x0, box.y0);
  const [x1,y1] = T(box.x0+box.w, box.y0+box.h);
  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x', x0); rect.setAttribute('y', y0);
  rect.setAttribute('width', x1-x0); rect.setAttribute('height', y1-y0);
  rect.setAttribute('fill','none');
  rect.setAttribute('stroke', color);
  rect.setAttribute('stroke-width','1.5');
  rect.setAttribute('stroke-dasharray','4,3');
  rect.setAttribute('opacity','0.7');
  svgOvl.appendChild(rect);
  if (label) {
    const t = document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x', x0+3); t.setAttribute('y', y0-4);
    t.setAttribute('fill', color); t.setAttribute('font-size','10');
    t.setAttribute('font-family','Courier New, monospace');
    t.textContent = label;
    svgOvl.appendChild(t);
  }
}

// ─── ОСНОВНЫЕ АЛГОРИТМЫ ───────────────────────────────────

// Gaussian blur
function gaussianBlur(data, w, h, passes=1) {
  const kern = [1,2,1,2,4,2,1,2,1];
  for (let p=0; p<passes; p++) {
    const tmp = new Uint8ClampedArray(data.length);
    for (let y=0; y<h; y++) for (let x=0; x<w; x++) {
      let r=0,g=0,b=0,s=0;
      for (let ky=-1; ky<=1; ky++) for (let kx=-1; kx<=1; kx++) {
        const nx=Math.min(w-1,Math.max(0,x+kx)), ny=Math.min(h-1,Math.max(0,y+ky));
        const k=kern[(ky+1)*3+(kx+1)], i=(ny*w+nx)*4;
        r+=data[i]*k; g+=data[i+1]*k; b+=data[i+2]*k; s+=k;
      }
      const i=(y*w+x)*4;
      tmp[i]=r/s; tmp[i+1]=g/s; tmp[i+2]=b/s; tmp[i+3]=255;
    }
    data.set(tmp);
  }
}

// Otsu threshold для одного канала
function otsuCh(ch) {
  const hist = new Float64Array(256);
  for (let i=0; i<ch.length; i++) hist[ch[i]]++;
  const N = ch.length;
  let sumB=0, wB=0, sum=0;
  for (let i=0; i<256; i++) sum += i*hist[i];
  let max=0, thr=128;
  for (let t=0; t<256; t++) {
    wB += hist[t]; if (!wB) continue;
    const wF = N-wB; if (!wF) break;
    sumB += t*hist[t];
    const mB=sumB/wB, mF=(sum-sumB)/wF;
    const s = wB*wF*(mB-mF)*(mB-mF);
    if (s>max) { max=s; thr=t; }
  }
  return thr;
}

// findOrnament — поиск области орнамента по активности строк/столбцов
function findOrnament(px, IW, IH) {
  const lum = p => (px[p]+px[p+1]+px[p+2])/3;
  const rowAct = new Array(IH).fill(0), colAct = new Array(IW).fill(0);
  for (let y=0; y<IH; y++) {
    let prev=-1, tr=0;
    for (let x=0; x<IW; x+=2) { const cc=lum((y*IW+x)*4)>127?1:0; if(cc!==prev){tr++;prev=cc;} }
    rowAct[y]=tr;
  }
  for (let x=0; x<IW; x++) {
    let prev=-1, tr=0;
    for (let y=0; y<IH; y+=2) { const cc=lum((y*IW+x)*4)>127?1:0; if(cc!==prev){tr++;prev=cc;} }
    colAct[x]=tr;
  }
  const maxRow=Math.max(...rowAct), maxCol=Math.max(...colAct);
  const rowThr=Math.max(4,maxRow*0.25), colThr=Math.max(4,maxCol*0.25);
  function longestBlock(act,thr){
    let bestS=0,bestE=-1,curS=-1,gap=0;
    const maxGap=Math.max(8,act.length*0.03);
    for(let i=0;i<act.length;i++){
      if(act[i]>=thr){if(curS<0)curS=i;gap=0;if(i-curS>bestE-bestS){bestS=curS;bestE=i;}}
      else{if(curS>=0){gap++;if(gap>maxGap){curS=-1;gap=0;}}}
    }
    return [bestS,bestE];
  }
  let [y0,y1]=longestBlock(rowAct,rowThr), [x0,x1]=longestBlock(colAct,colThr);
  if(y1<=y0||x1<=x0) return null;
  const side=Math.max(x1-x0,y1-y0), cx=(x0+x1)/2, cy=(y0+y1)/2;
  let nx0=Math.max(0,Math.round(cx-side/2)), ny0=Math.max(0,Math.round(cy-side/2));
  let nx1=Math.min(IW,nx0+side), ny1=Math.min(IH,ny0+side);
  const cw=nx1-nx0, ch=ny1-ny0;
  if(cw<20||ch<20) return null;
  return {x0:nx0,y0:ny0,w:cw,h:ch};
}

// findCodeBox — поиск области кода по цветовому контрасту к фону
function findCodeBox(px, IW, IH) {
  const GX=120, GY=Math.max(20,Math.round(120*IH/IW));
  const cw=IW/GX, ch=IH/GY;
  const avg=new Float64Array(GX*GY*3);
  for(let gy=0;gy<GY;gy++) for(let gx=0;gx<GX;gx++){
    let r=0,g=0,b=0,cnt=0;
    const x0=Math.floor(gx*cw),x1=Math.floor((gx+1)*cw),y0=Math.floor(gy*ch),y1=Math.floor((gy+1)*ch);
    for(let y=y0;y<y1;y+=2) for(let x=x0;x<x1;x+=2){const p=(y*IW+x)*4;r+=px[p];g+=px[p+1];b+=px[p+2];cnt++;}
    const i=(gy*GX+gx)*3; avg[i]=cnt?r/cnt:0; avg[i+1]=cnt?g/cnt:0; avg[i+2]=cnt?b/cnt:0;
  }
  const edge=[];
  for(let gx=0;gx<GX;gx++){edge.push([gx,0]);edge.push([gx,GY-1]);}
  for(let gy=0;gy<GY;gy++){edge.push([0,gy]);edge.push([GX-1,gy]);}
  const compMed=k=>{const a=edge.map(([gx,gy])=>avg[(gy*GX+gx)*3+k]).sort((x,y)=>x-y);return a[Math.floor(a.length/2)];};
  const bg=[compMed(0),compMed(1),compMed(2)];
  const fg=new Uint8Array(GX*GY);
  for(let i=0;i<GX*GY;i++){const dr=avg[i*3]-bg[0],dg=avg[i*3+1]-bg[1],db=avg[i*3+2]-bg[2];if(Math.sqrt(dr*dr+dg*dg+db*db)>55)fg[i]=1;}
  const lab=new Int32Array(GX*GY);let cur=0,best=0,bestBox=null;const stack=[];
  for(let s=0;s<GX*GY;s++){
    if(!fg[s]||lab[s])continue;cur++;let cnt=0,minx=GX,miny=GY,maxx=0,maxy=0;
    stack.push(s);lab[s]=cur;
    while(stack.length){const p=stack.pop();const gx=p%GX,gy=(p/GX)|0;cnt++;
      if(gx<minx)minx=gx;if(gx>maxx)maxx=gx;if(gy<miny)miny=gy;if(gy>maxy)maxy=gy;
      for(const [nx,ny] of [[gx-1,gy],[gx+1,gy],[gx,gy-1],[gx,gy+1]]){
        if(nx<0||ny<0||nx>=GX||ny>=GY)continue;const q=ny*GX+nx;if(fg[q]&&!lab[q]){lab[q]=cur;stack.push(q);}
      }
    }
    if(cnt>best){best=cnt;bestBox=[minx,miny,maxx,maxy];}
  }
  if(!bestBox)return null;
  let x0=Math.floor(bestBox[0]*cw),y0=Math.floor(bestBox[1]*ch),
      x1=Math.ceil((bestBox[2]+1)*cw),y1=Math.ceil((bestBox[3]+1)*ch);
  const padX=cw*0.5,padY=ch*0.5;
  x0=Math.max(0,Math.floor(x0-padX));y0=Math.max(0,Math.floor(y0-padY));
  x1=Math.min(IW,Math.ceil(x1+padX));y1=Math.min(IH,Math.ceil(y1+padY));
  return {x0,y0,w:x1-x0,h:y1-y0};
}

// gradCorners — поиск 4 углов по градиенту
function gradCorners(px, IW, IH, G=120) {
  const lum = p => (px[p*4]+px[p*4+1]+px[p*4+2])/3;
  const cw=IW/G, ch=IH/G;
  const gr=new Float64Array(G*G);
  for(let gy=0;gy<G;gy++) for(let gx=0;gx<G;gx++){
    let s=0,c=0;
    const x0=Math.floor(gx*cw),x1=Math.floor((gx+1)*cw),y0=Math.floor(gy*ch),y1=Math.floor((gy+1)*ch);
    for(let y=y0+1;y<y1-1;y+=2) for(let x=x0+1;x<x1-1;x+=2){
      const gxv=Math.abs(lum(y*IW+x+1)-lum(y*IW+x-1));
      const gyv=Math.abs(lum((y+1)*IW+x)-lum((y-1)*IW+x));
      s+=gxv+gyv;c++;
    }
    gr[gy*G+gx]=c?s/c:0;
  }
  const mx=Math.max(...gr), thr=mx*0.18;
  const fg=gr.map(v=>v>=thr?1:0);
  const dil=new Uint8Array(G*G);
  for(let gy=0;gy<G;gy++) for(let gx=0;gx<G;gx++){
    let any=0;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      const nx=gx+dx,ny=gy+dy;
      if(nx>=0&&ny>=0&&nx<G&&ny<G&&fg[ny*G+nx])any=1;
    }
    dil[gy*G+gx]=any;
  }
  const labi=new Int32Array(G*G);let cur2=0,best=0,bestPts=null;const st=[];
  for(let s=0;s<G*G;s++){
    if(!dil[s]||labi[s])continue;cur2++;const pts=[];st.push(s);labi[s]=cur2;
    while(st.length){const p=st.pop();pts.push(p);const gx=p%G,gy=(p/G)|0;
      for(const [nx,ny] of [[gx-1,gy],[gx+1,gy],[gx,gy-1],[gx,gy+1]]){
        if(nx<0||ny<0||nx>=G||ny>=G)continue;const q=ny*G+nx;if(dil[q]&&!labi[q]){labi[q]=cur2;st.push(q);}
      }
    }
    if(pts.length>best){best=pts.length;bestPts=pts;}
  }
  if(!bestPts||best<8) return null;
  let TL,TR,BR,BL;
  for(const p of bestPts){
    const gx=p%G,gy=(p/G)|0;
    const X=(gx+0.5)*cw, Y=(gy+0.5)*ch;
    const s=X+Y, d=X-Y;
    if(!TL||s<TL.s)TL={X,Y,s};
    if(!BR||s>BR.s)BR={X,Y,s};
    if(!TR||d>TR.d)TR={X,Y,d};
    if(!BL||d<BL.d)BL={X,Y,d};
  }
  const dd=(a,b)=>Math.hypot(a.X-b.X,a.Y-b.Y);
  const side=(dd(TL,TR)+dd(TR,BR)+dd(BR,BL)+dd(BL,TL))/4;
  return {TL:[TL.X,TL.Y],TR:[TR.X,TR.Y],BR:[BR.X,BR.Y],BL:[BL.X,BL.Y],side};
}

// findRuler
function ruler_runs(get,len){let prev=-1,l=0,runs=[];for(let i=0;i<len;i++){const c=get(i)>127?1:0;if(c===prev)l++;else{if(prev>=0)runs.push(l);prev=c;l=1;}}runs.push(l);return runs;}
function ruler_median(a){const b=[...a].sort((x,y)=>x-y);return b[Math.floor(b.length/2)];}
function ruler_score(runs){if(runs.length<5)return null;const m=ruler_median(runs);if(m<3)return null;let reg=0;for(const r of runs)if(r>=m*0.55&&r<=m*1.45)reg++;return{m,frac:reg/runs.length,count:runs.length};}
function ruler_edge(lumFn,W,depth){const rows=[];for(let y=1;y<depth;y++){const s=ruler_score(ruler_runs(x=>lumFn(x,y),W));if(s&&s.frac>=0.85&&s.count>=7&&s.count<=200&&s.m>=4)rows.push(s);}if(rows.length<2)return null;const freq=new Map();for(const r of rows)freq.set(r.count,(freq.get(r.count)||0)+1);let T=null,fb=0;for(const [k,v] of freq)if(v>fb){fb=v;T=k;}return{T,cell:ruler_median(rows.filter(r=>r.count===T).map(r=>r.m)),votes:fb};}
function findRuler(px,IW,IH){if(IW!==IH)return null;const lum=(x,y)=>{const p=(y*IW+x)*4;return(px[p]+px[p+1]+px[p+2])/3;};const depth=Math.max(20,Math.floor(IW*0.09));const edges=[ruler_edge((x,y)=>lum(x,y),IW,depth),ruler_edge((x,y)=>lum(x,IH-1-y),IW,depth),ruler_edge((x,y)=>lum(y,x),IW,depth),ruler_edge((x,y)=>lum(IW-1-y,x),IW,depth)].filter(Boolean);if(!edges.length)return null;const freq=new Map();for(const e of edges)freq.set(e.T,(freq.get(e.T)||0)+e.votes);let T=null,fb=0;for(const [k,v] of freq)if(v>fb){fb=v;T=k;}return{T,cell:ruler_median(edges.filter(e=>e.T===T).map(e=>e.cell)),edges:edges.length};}

// cropPx
function cropPx(px,IW,IH,box){const{x0,y0,w,h}=box;const out=new Uint8ClampedArray(w*h*4);for(let y=0;y<h;y++)for(let x=0;x<w;x++){const src=((y0+y)*IW+(x0+x))*4,dst=(y*w+x)*4;out[dst]=px[src];out[dst+1]=px[src+1];out[dst+2]=px[src+2];out[dst+3]=255;}return out;}

// deskew — выпрямление перспективы
function deskew(px, IW, IH, corners, N) {
  const {TL,TR,BR,BL}=corners;
  const x0=TL[0],y0=TL[1],x1=TR[0],y1=TR[1],x2=BR[0],y2=BR[1],x3=BL[0],y3=BL[1];
  const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;
  let a,b,c,d,e,f,g,h;
  if(Math.abs(dx3)<1e-9&&Math.abs(dy3)<1e-9){a=x1-x0;b=x3-x0;c=x0;d=y1-y0;e=y3-y0;f=y0;g=0;h=0;}
  else{const den=dx1*dy2-dx2*dy1;g=(dx3*dy2-dx2*dy3)/den;h=(dx1*dy3-dx3*dy1)/den;a=x1-x0+g*x1;b=x3-x0+h*x3;c=x0;d=y1-y0+g*y1;e=y3-y0+h*y3;f=y0;}
  const samp=(x,y,ch)=>{const xi=Math.max(0,Math.min(IW-1,Math.floor(x))),yi=Math.max(0,Math.min(IH-1,Math.floor(y)));const xf=Math.max(0,Math.min(1,x-xi)),yf=Math.max(0,Math.min(1,y-yi));const x1_=Math.min(IW-1,xi+1),y1_=Math.min(IH-1,yi+1);const A=px[(yi*IW+xi)*4+ch],B=px[(yi*IW+x1_)*4+ch],D=px[(y1_*IW+xi)*4+ch],E=px[(y1_*IW+x1_)*4+ch];return A*(1-xf)*(1-yf)+B*xf*(1-yf)+D*(1-xf)*yf+E*xf*yf;};
  const out=new Uint8ClampedArray(N*N*4);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const u=i/(N-1),v=j/(N-1);const den=g*u+h*v+1;const x=(a*u+b*v+c)/den,y=(d*u+e*v+f)/den;const dst=(j*N+i)*4;out[dst]=samp(x,y,0);out[dst+1]=samp(x,y,1);out[dst+2]=samp(x,y,2);out[dst+3]=255;}
  return out;
}

// ─── TAINA DECODER (базовые функции) ──────────────────────
const enc=new TextEncoder(), decFatal=new TextDecoder('utf-8',{fatal:true});
function isClean(t){for(const ch of t){const o=ch.codePointAt(0);if(o===0)return false;if(o<32&&ch!=='\n'&&ch!=='\t')return false;}return true;}
function bytesToText(by){while(by.length&&by[by.length-1]===0)by.pop();if(!by.length)return null;try{const t=decFatal.decode(new Uint8Array(by));return isClean(t)?t:null;}catch(e){return null;}}
function textBits(t){const d=enc.encode(t),b=new Uint8Array(d.length*8);for(let i=0;i<d.length;i++)for(let k=0;k<8;k++)b[i*8+k]=(d[i]>>(7-k))&1;return b;}
function Rof(n){return(n-1)/2;}
function baseCells(m,n){const c=Rof(n),o=[];if(m==='oct'){for(let i=0;i<=c;i++)for(let j=0;j<=i;j++)o.push([c+i,c+j]);}else if(m==='quad'){for(let i=0;i<=c;i++)for(let j=0;j<=c;j++)o.push([c+i,c+j]);}else{for(let y=0;y<n;y++)for(let i=0;i<=c;i++)o.push([c+i,y]);}return o;}
function mirrors(m,n,x,y){const c=Rof(n),i=x-c,j=y-c;let p;if(m==='oct')p=[[i,j],[j,i],[-i,j],[-j,i],[i,-j],[j,-i],[-i,-j],[-j,-i]];else if(m==='quad')p=[[i,j],[-i,j],[i,-j],[-i,-j]];else p=[[i,j],[-i,j]];const o=[];for(const[a,b]of p){const X=c+a,Y=c+b;if(X>=0&&Y>=0&&X<n&&Y<n)o.push([X,Y]);}return o;}
function fillChannel(t,n,m,markBit){const g=new Uint8Array(n*n),dm=new Uint8Array(n*n),bc=baseCells(m,n);let seq;if(markBit===null){seq=textBits(t);}else{const bits=textBits(t);seq=new Uint8Array(bits.length+1);seq[0]=markBit;seq.set(bits,1);}const lim=Math.min(seq.length,bc.length);for(let i=0;i<lim;i++){const[x,y]=bc[i];for(const[X,Y]of mirrors(m,n,x,y)){dm[Y*n+X]=1;if(seq[i])g[Y*n+X]=1;}}return{g,dm};}
function markCell(g,n,m){const[x,y]=baseCells(m,n)[0];return g[y*n+x]?1:0;}
function decodeSector(g,n,m,offset){const bc=baseCells(m,n),by=[],start=offset||0;for(let i=start;i+7<bc.length;i+=8){let v=0;for(let b=0;b<8;b++){const[x,y]=bc[i+b];v=(v<<1)|(g[y*n+x]?1:0);}by.push(v);}return bytesToText(by);}
function decodeVoted(g,n,m,offset){const bc=baseCells(m,n),by=[],margins=[],start=offset||0;for(let i=start;i+7<bc.length;i+=8){let v=0;for(let b=0;b<8;b++){const[x,y]=bc[i+b],cells=mirrors(m,n,x,y);let ones=0;for(const[X,Y]of cells)ones+=g[Y*n+X]?1:0;const cnt=cells.length;let bit;if(ones*2>cnt)bit=1;else if(ones*2<cnt)bit=0;else bit=g[y*n+x]?1:0;margins.push(Math.abs(2*ones-cnt)/cnt);v=(v<<1)|bit;}by.push(v);}return{text:bytesToText(by),minMargin:margins.length?Math.min(...margins):0};}

// ─── РЕНДЕР RGB-КАНАЛОВ ───────────────────────────────────
function renderChannelCanvas(cv, g, n, color) {
  cv.width = n; cv.height = n;
  const ctx = cv.getContext('2d');
  const idata = ctx.createImageData(n, n);
  for (let y=0; y<n; y++) for (let x=0; x<n; x++) {
    const i=(y*n+x)*4;
    const on = g[y*n+x];
    if (on) {
      idata.data[i]   = color[0];
      idata.data[i+1] = color[1];
      idata.data[i+2] = color[2];
    } else {
      idata.data[i]=idata.data[i+1]=idata.data[i+2]=20;
    }
    idata.data[i+3]=255;
  }
  ctx.putImageData(idata,0,0);
}

// ─── ГЛАВНЫЙ PIPELINE ─────────────────────────────────────
function runDebugPipeline(img) {
  const t0 = performance.now();
  clrLog();
  clearOverlay();
  document.getElementById('result-bar').textContent = 'Обробка...';
  document.getElementById('result-bar').className = 'result-bar';
  // Сброс RGB каналов
  ['r','g','b'].forEach(ch => {
    const cv = document.getElementById('cv-'+ch);
    cv.width=cv.height=200;
    cv.getContext('2d').clearRect(0,0,200,200);
    document.getElementById('res-'+ch).textContent='—';
  });

  // 1. PREPROCESSING
  Lh('PRE-PROCESSING');
  const iw=img.naturalWidth||img.width||0, ih=img.naturalHeight||img.height||0;
  if(iw<10||ih<10){Le('Зображення занадто мале');setSt('Помилка',errored);return;}

  const AS=Math.max(512,Math.min(1200,Math.max(iw,ih)));
  Li('Розмір джерела: '+iw+'×'+ih);
  Li('Розмір буфера: '+AS+'×'+AS);

  const cc=document.createElement('canvas');cc.width=AS;cc.height=AS;
  const g=cc.getContext('2d',{willReadFrequently:true});
  const tmp=document.createElement('canvas');tmp.width=iw;tmp.height=ih;
  const tg=tmp.getContext('2d',{willReadFrequently:true});tg.drawImage(img,0,0);
  const cp=tg.getImageData(0,0,1,1).data;
  g.fillStyle='rgb('+cp[0]+','+cp[1]+','+cp[2]+')';g.fillRect(0,0,AS,AS);
  const scale=Math.min(AS/iw,AS/ih),dw=iw*scale,dh=ih*scale;
  g.imageSmoothingEnabled=true;
  g.drawImage(img,(AS-dw)/2,(AS-dh)/2,dw,dh);

  let px=g.getImageData(0,0,AS,AS).data;
  const IW=AS, IH=AS;

  // Gaussian blur
  const blurData = new Uint8ClampedArray(px);
  gaussianBlur(blurData, IW, IH, 1);
  Li('Gaussian blur 1px (придушення муару/шуму)');

  // Otsu по каналам
  const chR=new Uint8Array(IW*IH), chG=new Uint8Array(IW*IH), chB=new Uint8Array(IW*IH);
  for(let i=0;i<IW*IH;i++){chR[i]=blurData[i*4];chG[i]=blurData[i*4+1];chB[i]=blurData[i*4+2];}
  const thrR=otsuCh(chR), thrG=otsuCh(chG), thrB=otsuCh(chB);
  Li('Otsu поріг: R='+thrR+' G='+thrG+' B='+thrB);

  // Показать изображение на canvas
  showImage(blurData, IW, IH);

  // 2. ПОИСК РАМКИ — несколько методов
  Lh('1. ПОШУК РАМКИ');

  let foundCorners = null;
  let foundBox = null;

  // 2a. findCodeBox
  const box = findCodeBox(blurData, IW, IH);
  if(box) {
    Li('findCodeBox: x0='+box.x0+' y0='+box.y0+' w='+box.w+' h='+box.h);
    foundBox = {x0:box.x0, y0:box.y0, w:box.w, h:box.h};
    drawBox({x0:box.x0,y0:box.y0,w:box.w,h:box.h}, IW, IH, 'CodeBox', '#5ec8e8');
  } else {
    Lw('findCodeBox: не знайдено');
  }

  // 2b. findOrnament
  const orn = findOrnament(blurData, IW, IH);
  if(orn) {
    Li('findOrnament: x0='+orn.x0+' y0='+orn.y0+' w='+orn.w+' h='+orn.h);
    drawBox({x0:orn.x0,y0:orn.y0,w:orn.w,h:orn.h}, IW, IH, 'Ornament', '#c9a876');
  } else {
    Lw('findOrnament: не знайдено');
  }

  // 2c. gradCorners — 4 кутки
  const cor = gradCorners(blurData, IW, IH, 120);
  if(cor) {
    Lok('gradCorners: side='+cor.side.toFixed(1)+'px');
    Li('TL('+cor.TL.map(v=>v.toFixed(0)).join(',')+')'+
       ' TR('+cor.TR.map(v=>v.toFixed(0)).join(',')+')'+
       ' BR('+cor.BR.map(v=>v.toFixed(0)).join(',')+')'+
       ' BL('+cor.BL.map(v=>v.toFixed(0)).join(',')+')'
    );
    foundCorners = cor;
    drawCorners(
      {TL:cor.TL,TR:cor.TR,BR:cor.BR,BL:cor.BL},
      IW, IH, 'gradCorners', '#2aaa3a'
    );
  } else {
    Lw('gradCorners: не знайдено');
  }

  // 3. RULER
  Lh('2. ЛІНІЙКА (RULER)');
  let rulerResult = null;
  const rulerSrc = foundBox ? cropPx(blurData,IW,IH,foundBox) : blurData;
  const rulerW = foundBox ? foundBox.w : IW;
  const rulerH = foundBox ? foundBox.h : IH;
  const ruler = findRuler(rulerSrc, rulerW, rulerH);
  if(ruler) {
    Lok('Ruler T='+ruler.T+' cell='+ruler.cell.toFixed(1)+'px edges='+ruler.edges);
    rulerResult = ruler;
  } else {
    Lw('Ruler: не знайдено');
  }

  // 4. WARP (если нашли углы)
  let warpPx=null, warpN=0;
  if(foundCorners) {
    Lh('3. WARP (виправлення перспективи)');
    warpN = Math.max(400, Math.min(900, Math.round(foundCorners.side)));
    warpPx = deskew(blurData, IW, IH, foundCorners, warpN);
    Lok('Warp → '+warpN+'×'+warpN);
  }

  // 5. DECODER
  Lh('4. ДЕКОДУВАННЯ');
  const MINN=7, RGBTHR=125;
  const lum2=p=>(blurData[p]+blurData[p+1]+blurData[p+2])/3;

  // Выбираем источник для декодирования
  let decodePx=warpPx||blurData, decW=warpPx?warpN:IW, decH=warpPx?warpN:IH;
  if(!warpPx && foundBox){
    decodePx=cropPx(blurData,IW,IH,foundBox);
    decW=foundBox.w;decH=foundBox.h;
  }

  // Определяем T через ruler или медиану
  let Tf=null;
  if(rulerResult) Tf=rulerResult.T;
  else {
    // Попытка из размера области
    if(foundBox){Tf=Math.round(Math.max(foundBox.w,foundBox.h)/10);}
  }

  let allResults=[], bestResult=null;

  if(Tf && decW===decH) {
    Li('Розмір поля T='+Tf+' → перебір pad 2..5');
    const cell=decW/Tf;
    for(let pad=2;pad<=5;pad++){
      const n=Tf-2*pad;
      if(n<MINN||n%2===0)continue;
      const cr=new Uint8Array(n*n),cg=new Uint8Array(n*n),cb=new Uint8Array(n*n),cl=new Uint8Array(n*n);
      for(let y=0;y<n;y++) for(let x=0;x<n;x++){
        const X=Math.min(decW-1,Math.floor((x+pad+.5)*cell));
        const Y=Math.min(decH-1,Math.floor((y+pad+.5)*cell));
        const p=(Y*decW+X)*4;
        cr[y*n+x]=decodePx[p]>RGBTHR?1:0;
        cg[y*n+x]=decodePx[p+1]>RGBTHR?1:0;
        cb[y*n+x]=decodePx[p+2]>RGBTHR?1:0;
        cl[y*n+x]=(decodePx[p]+decodePx[p+1]+decodePx[p+2])/3>110?1:0;
      }

      // Рендерим RGB каналы
      if(pad===3){
        renderChannelCanvas(document.getElementById('cv-r'),cr,n,[220,50,60]);
        renderChannelCanvas(document.getElementById('cv-g'),cg,n,[65,195,65]);
        renderChannelCanvas(document.getElementById('cv-b'),cb,n,[60,70,215]);
      }

      for(const m of ['oct','quad','half']){
        // Моно
        const t=decodeSector(cl,n,m,0);
        if(t!==null){
          allResults.push({kind:'one',mode:m,n,pad,text:t});
          Li('pad='+pad+' ['+m+'] МОНО → "'+t.slice(0,30)+'"');
        }
        // Voted моно
        const vl=decodeVoted(cl,n,m,0);
        if(vl.text!==null&&vl.minMargin>=0.3&&t===null){
          allResults.push({kind:'voted-one',mode:m,n,pad,text:vl.text,margin:vl.minMargin});
          Li('pad='+pad+' ['+m+'] VOTED → "'+vl.text.slice(0,30)+'" margin='+vl.minMargin.toFixed(2));
        }
        // RGB три канали
        const tr=decodeSector(cr,n,m,0),tg=decodeSector(cg,n,m,0),tb=decodeSector(cb,n,m,0);
        const ne=[tr,tg,tb].filter(x=>x!==null);
        if(ne.length>=2&&!ne.every(x=>x===ne[0])){
          allResults.push({kind:'three',mode:m,n,pad,res:[tr,tg,tb]});
          Li('pad='+pad+' ['+m+'] RGB → R:"'+(tr||'—')+'" G:"'+(tg||'—')+'" B:"'+(tb||'—')+'"');
        }
        // Моноліт
        if(markCell(cr,n,m)===1){
          const rR=decodeSector(cr,n,m,1),rG=decodeSector(cg,n,m,0),rB=decodeSector(cb,n,m,0);
          if(rR!==null){
            const mono=(rR||'')+(rG||'')+(rB||'');
            allResults.push({kind:'mono',mode:m,n,pad,text:mono});
            Li('pad='+pad+' ['+m+'] MONO-RGB → "'+mono.slice(0,30)+'"');
          }
        }
      }
    }

    // Обновляем подписи RGB каналов
    if(Tf>=2) {
      const n=Tf-6;
      if(n>=MINN&&n%2===0===false){
        const bestR=allResults.find(r=>r.res&&r.res[0])||allResults.find(r=>r.kind==='three');
        const bestMono=allResults.find(r=>r.kind==='one'||r.kind==='mono');
        document.getElementById('res-r').textContent=bestMono?bestMono.text.slice(0,20):bestR?.res?.[0]?.slice(0,20)||'—';
        document.getElementById('res-g').textContent=bestR?.res?.[1]?.slice(0,20)||'—';
        document.getElementById('res-b').textContent=bestR?.res?.[2]?.slice(0,20)||'—';
      }
    }
  } else {
    Lw('T не визначено — пропуск декодування');
  }

  // Выбор лучшего
  Lh('5. РЕЗУЛЬТАТ');
  allResults.sort((a,b)=>{
    const al=(a.text||a.res?.filter(x=>x).join(''))?.length||0;
    const bl=(b.text||b.res?.filter(x=>x).join(''))?.length||0;
    const ap=(a.kind==='one'?3:a.kind==='mono'?2:1);
    const bp=(b.kind==='one'?3:b.kind==='mono'?2:1);
    return (bp-ap)||bl-al;
  });

  const elapsed = (performance.now()-t0).toFixed(0);
  Li('Варіантів знайдено: '+allResults.length);
  Li('Час: '+elapsed+' мс');

  if(allResults.length) {
    bestResult=allResults[0];
    const txt=bestResult.text||bestResult.res?.filter(x=>x).join(' | ')||'';
    Lok('РЕЗУЛЬТАТ: "'+txt+'" ['+bestResult.kind+'-'+bestResult.mode+']'+(bestResult.margin?' margin='+bestResult.margin.toFixed(2):''));
    allResults.slice(0,3).forEach(r=>{
      const t=r.text||r.res?.filter(x=>x).join(' | ')||'';
      Lv('['+r.kind+'/'+r.mode+'/n'+r.n+'] "'+t.slice(0,40)+'"');
    });

    const resBar=document.getElementById('result-bar');
    resBar.className='result-bar';
    resBar.textContent='✓ "'+txt+'" ['+bestResult.kind+'-'+bestResult.mode+']';
    setSt('Декодовано за '+elapsed+'мс', 'ok');
  } else {
    Le('Декодування не вдалося');
    const resBar=document.getElementById('result-bar');
    resBar.className='result-bar fail';
    resBar.textContent='✗ Код не розпізнано';
    setSt('Не розпізнано', 'err');
  }
}

// ─── ФАЙЛ ─────────────────────────────────────────────────
document.getElementById('file-in').onchange = e => {
  const f=e.target.files[0]; if(!f) return;
  const url=URL.createObjectURL(f);
  const img=new Image();
  img.onload=()=>{
    URL.revokeObjectURL(url);
    setSt('Обробка...','warn');
    document.getElementById('viewfinder').style.display='none';
    stopCam();
    setTimeout(()=>runDebugPipeline(img), 30);
  };
  img.src=url;
  e.target.value='';
};

// ─── КАМЕРА ───────────────────────────────────────────────
const videoEl=document.getElementById('video');
let camStream=null, camRAF=null, camBusy=false, camTimer=0;

async function startCam(){
  if(camStream){stopCam();return;}
  try{
    camStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1920}}
    });
    videoEl.srcObject=camStream;
    videoEl.setAttribute('playsinline','');
    await videoEl.play();
    videoEl.style.display='block';
    cvPrev.style.display='none';
    document.getElementById('viewfinder').style.display='block';
    document.getElementById('btn-cam').textContent='⏹ Стоп';
    document.getElementById('btn-cam').classList.add('active');
    setSt('Камера активна — наводьте на код','ok');
    clrLog();
    Lh('КАМЕРА АКТИВНА');
    Li('facingMode: environment');
    camTimer=0; camBusy=false;
    camLoop();
  }catch(e){
    Le('Камера недоступна: '+e.message);
    setSt('Камера недоступна','err');
  }
}

function stopCam(){
  if(camRAF){cancelAnimationFrame(camRAF);camRAF=null;}
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
  videoEl.style.display='none';
  cvPrev.style.display='block';
  document.getElementById('viewfinder').style.display='none';
  document.getElementById('btn-cam').textContent='📷 Камера';
  document.getElementById('btn-cam').classList.remove('active');
}

function camLoop(){
  if(!camStream)return;
  const now=performance.now();
  if(!camBusy&&videoEl.readyState>=2&&now-camTimer>500){
    camTimer=now; camBusy=true;
    try{
      const vw=videoEl.videoWidth, vh=videoEl.videoHeight;
      const tmp=document.createElement('canvas');
      tmp.width=vw;tmp.height=vh;
      tmp.getContext('2d').drawImage(videoEl,0,0);
      // Для камери показуємо кадр на canvas теж
      cvPrev.style.display='none';
      // Обробка
      runDebugPipeline(tmp);
    }catch(e){}
    camBusy=false;
  }
  camRAF=requestAnimationFrame(camLoop);
}

document.getElementById('btn-cam').onclick=()=>camStream?stopCam():startCam();
document.getElementById('btn-clear').onclick=()=>{
  stopCam();clrLog();clearOverlay();
  cvPrev.width=cvPrev.height=1;ctxPrev.clearRect(0,0,1,1);
  document.getElementById('result-bar').textContent='Результат з\'явиться тут...';
  document.getElementById('result-bar').className='result-bar';
  setSt('Очікування команди...','idle');
  ['r','g','b'].forEach(ch=>{
    const cv=document.getElementById('cv-'+ch);cv.width=cv.height=200;cv.getContext('2d').clearRect(0,0,200,200);
    document.getElementById('res-'+ch).textContent='—';
  });
};
