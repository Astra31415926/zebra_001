<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CAM DEBUG · taina</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#080808;color:#aaa;font:11px/1.6 'Courier New',monospace;min-height:100%}
body{padding:8px;display:flex;flex-direction:column;gap:8px}

#topbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
h1{font-size:10px;letter-spacing:3px;color:#4a8ab0;white-space:nowrap}
.btn{background:#111;border:1px solid #222;color:#777;padding:5px 12px;cursor:pointer;font:inherit;letter-spacing:1px;border-radius:3px}
.btn:hover{border-color:#4a8ab0;color:#ccc}
.btn.on{border-color:#4a8ab0;color:#4a8ab0}
#interval-lbl{color:#555;font-size:10px}

#canvases{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cv-wrap{display:flex;flex-direction:column;gap:3px}
.cv-lbl{font-size:9px;letter-spacing:2px;color:#2a5a7a;text-transform:uppercase}
canvas{width:100%;border:1px solid #1a1a1a;border-radius:3px;display:block;background:#000;image-rendering:pixelated}

#log-wrap{flex:1}
#log-title{font-size:9px;letter-spacing:3px;color:#2a5a7a;margin-bottom:4px}
#log{height:320px;overflow-y:auto;border:1px solid #1a1a1a;border-radius:3px;padding:6px;line-height:1.8}
.lh{color:#2a6a9a;margin-top:4px;font-weight:bold}
.lok{color:#2a7a3a}
.lw{color:#8a6a1a}
.le{color:#9a2a2a}
.li{color:#666}
.lv{color:#5a5a9a}
#status{padding:4px 8px;border:1px solid #1a1a1a;border-radius:3px;font-size:10px;letter-spacing:2px}
</style>
</head>
<body>

<div id="topbar">
  <h1>CAM·DEBUG</h1>
  <button class="btn" id="camBtn">▶ Камера</button>
  <button class="btn" id="snapBtn" disabled>📷 Знімок</button>
  <button class="btn" id="saveBtn" disabled>💾 Зберегти кадр</button>
  <button class="btn on" id="autoBtn">⟳ Авто: вкл</button>
  <span id="interval-lbl">кожні 1.5с</span>
  <button class="btn" id="clrBtn">✕ Лог</button>
</div>

<div id="status"><span id="st" style="color:#333">— очікування —</span></div>

<div id="canvases">
  <div class="cv-wrap">
    <div class="cv-lbl">Камера (живе)</div>
    <canvas id="cvLive" height="300"></canvas>
  </div>
  <div class="cv-wrap">
    <div class="cv-lbl">Аналіз кадру</div>
    <canvas id="cvAnalysis" height="300"></canvas>
  </div>
  <div class="cv-wrap">
    <div class="cv-lbl">Варп (після корекції)</div>
    <canvas id="cvWarp" height="300"></canvas>
  </div>
  <div class="cv-wrap">
    <div class="cv-lbl">Сітка + кружечки</div>
    <canvas id="cvGrid" height="300"></canvas>
  </div>
</div>

<div id="log-wrap">
  <div id="log-title">ДІАГНОСТИКА</div>
  <div id="log"></div>
</div>

<video id="vid" autoplay playsinline muted style="display:none"></video>

<script>
'use strict';

// ── Лог ──
const logEl = document.getElementById('log');
function aL(m,c){const d=document.createElement('div');d.textContent=m;if(c)d.className=c;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight;}
const Lh=m=>aL('── '+m,'lh');
const Lok=m=>aL('✓ '+m,'lok');
const Lw=m=>aL('⚠ '+m,'lw');
const Le=m=>aL('✗ '+m,'le');
const Li=m=>aL('  '+m,'li');
const Lv=m=>aL('  '+m,'lv');
const clrLog=()=>{logEl.innerHTML='';};
const setSt=(t,ok)=>{const e=document.getElementById('st');e.textContent=t;e.style.color=ok===true?'#55eb5a':ok===false?'#eb5555':'#888';};

document.getElementById('clrBtn').onclick=clrLog;

// ── Canvas helpers ──
const cvLive   = document.getElementById('cvLive');
const cvAnalysis = document.getElementById('cvAnalysis');
const cvWarp   = document.getElementById('cvWarp');
const cvGrid   = document.getElementById('cvGrid');

// ── Камера ──
const vid = document.getElementById('vid');
let stream = null, autoTimer = null, autoOn = true;

document.getElementById('camBtn').onclick = async () => {
  if(stream){ stopCam(); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment', width:{ideal:1920}, height:{ideal:1920}}
    });
    vid.srcObject = stream;
    await vid.play();
    document.getElementById('camBtn').textContent = '⏹ Зупинити';
    document.getElementById('snapBtn').disabled = false;
    document.getElementById('saveBtn').disabled = true; // активується після першого знімка
    drawLive();
    if(autoOn) startAuto();
    Lok('Камера запущена: '+vid.videoWidth+'×'+vid.videoHeight);
  }catch(e){ Le('Камера: '+e.message); }
};

function stopCam(){
  if(autoTimer){clearInterval(autoTimer);autoTimer=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  vid.srcObject=null;
  document.getElementById('camBtn').textContent='▶ Камера';
  document.getElementById('snapBtn').disabled=true;
  document.getElementById('saveBtn').disabled=true;
  setSt('зупинено',null);
}

// Живе відео на лівий канвас
function drawLive(){
  if(!stream)return;
  const ctx=cvLive.getContext('2d');
  cvLive.width=vid.videoWidth||320;cvLive.height=vid.videoHeight||240;
  ctx.drawImage(vid,0,0);
  requestAnimationFrame(drawLive);
}

// ── Авто-режим ──
const autoBtn = document.getElementById('autoBtn');
autoBtn.onclick=()=>{
  autoOn=!autoOn;
  autoBtn.textContent=autoOn?'⟳ Авто: вкл':'⟳ Авто: викл';
  autoBtn.classList.toggle('on',autoOn);
  if(autoOn&&stream)startAuto(); else if(autoTimer){clearInterval(autoTimer);autoTimer=null;}
};
function startAuto(){
  if(autoTimer)clearInterval(autoTimer);
  autoTimer=setInterval(()=>{if(stream&&vid.readyState>=2)doSnap();},1500);
}

document.getElementById('snapBtn').onclick=doSnap;

// Зберегти останній проаналізований кадр
let lastFrameCanvas = null;
document.getElementById('saveBtn').onclick = () => {
  if(!lastFrameCanvas) return;
  lastFrameCanvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cam_frame_' + Date.now() + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }, 'image/png');
};

// ── Знімок і аналіз ──
function doSnap(){
  if(!stream||vid.readyState<2)return;
  const iw=vid.videoWidth,ih=vid.videoHeight;
  if(iw<1||ih<1)return;

  // Масштаб до 900px
  const maxS=900,sc=Math.min(1,maxS/Math.max(iw,ih));
  const W=Math.round(iw*sc),H=Math.round(ih*sc);
  const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;
  tmp.getContext('2d').drawImage(vid,0,0,iw,ih,0,0,W,H);
  const idata=tmp.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H);

  // Зберігаємо кадр для кнопки "Зберегти"
  lastFrameCanvas = tmp;
  document.getElementById('saveBtn').disabled = false;

  clrLog();
  Lh('КАДР '+W+'×'+H+' (оригінал '+iw+'×'+ih+')');

  // Малюємо вихідний кадр
  cvAnalysis.width=W;cvAnalysis.height=H;
  cvAnalysis.getContext('2d').putImageData(idata,0,0);

  const result = pipeline(idata,W,H);
  visualize(result,idata,W,H);
}

// ═══════════════════════════════════════════════════════
//  ZEBRA FINDER v5.1 — не змінювати
// ═══════════════════════════════════════════════════════

function toGray(idata,w,h){const d=idata.data,g=new Uint8Array(w*h);for(let i=0;i<w*h;i++)g[i]=(77*d[i*4]+150*d[i*4+1]+29*d[i*4+2])>>8;return g;}
function sampleBG(gray,w,h,s=5){const v=[];for(let dy=0;dy<s;dy++)for(let dx=0;dx<s;dx++){v.push(gray[dy*w+dx],gray[dy*w+(w-1-dx)],gray[(h-1-dy)*w+dx],gray[(h-1-dy)*w+(w-1-dx)]);}v.sort((a,b)=>a-b);return v[v.length>>1];}
function makeMask(gray,w,h,bg,tol){const m=new Uint8Array(w*h);for(let i=0;i<w*h;i++)m[i]=Math.abs(gray[i]-bg)>tol?1:0;return m;}
function erodeMask(mask,w,h){const out=new Uint8Array(w*h);for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++)if(mask[y*w+x]&&mask[(y-1)*w+x]&&mask[(y+1)*w+x]&&mask[y*w+x-1]&&mask[y*w+x+1])out[y*w+x]=1;return out;}
function findCorners(mask,w,h,slack=12){
  let tlS=Infinity,trS=-Infinity,brS=-Infinity,blS=Infinity;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!mask[y*w+x])continue;const s=x+y,d=x-y;if(s<tlS)tlS=s;if(d>trS)trS=d;if(s>brS)brS=s;if(d<blS)blS=d;}
  let tlX=0,tlY=0,tlN=0,trX=0,trY=0,trN=0,brX=0,brY=0,brN=0,blX=0,blY=0,blN=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(!mask[y*w+x])continue;const s=x+y,d=x-y;if(s<=tlS+slack){tlX+=x;tlY+=y;tlN++;}if(d>=trS-slack){trX+=x;trY+=y;trN++;}if(s>=brS-slack){brX+=x;brY+=y;brN++;}if(d<=blS+slack){blX+=x;blY+=y;blN++;}}
  const avg=(sx,sy,n,dx,dy)=>n?{x:Math.round(sx/n),y:Math.round(sy/n)}:{x:dx,y:dy};
  return{tl:avg(tlX,tlY,tlN,0,0),tr:avg(trX,trY,trN,w-1,0),br:avg(brX,brY,brN,w-1,h-1),bl:avg(blX,blY,blN,0,h-1)};}
function spread(c){const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);return Math.max(d(c.tl,c.tr),d(c.tr,c.br),d(c.br,c.bl),d(c.bl,c.tl));}
function computeH(src4,dst4){const rows=[],rhs=[];for(let i=0;i<4;i++){const sx=src4[i].x,sy=src4[i].y,dx=dst4[i].x,dy=dst4[i].y;rows.push([sx,sy,1,0,0,0,-sx*dx,-sy*dx]);rhs.push(dx);rows.push([0,0,0,sx,sy,1,-sx*dy,-sy*dy]);rhs.push(dy);}const h=gaussElim(rows,rhs);if(!h)return null;return[[h[0],h[1],h[2]],[h[3],h[4],h[5]],[h[6],h[7],1]];}
function gaussElim(A,b){const n=b.length,M=A.map((r,i)=>[...r,b[i]]);for(let c=0;c<n;c++){let mr=c,mv=Math.abs(M[c][c]);for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>mv){mv=Math.abs(M[r][c]);mr=r;}[M[c],M[mr]]=[M[mr],M[c]];const pv=M[c][c];if(Math.abs(pv)<1e-12)return null;for(let r=c+1;r<n;r++){const f=M[r][c]/pv;for(let j=c;j<=n;j++)M[r][j]-=f*M[c][j];}}const x=new Array(n).fill(0);for(let i=n-1;i>=0;i--){x[i]=M[i][n];for(let j=i+1;j<n;j++)x[i]-=M[i][j]*x[j];x[i]/=M[i][i];}return x;}
function inv3(M){const[[a,b,c],[d,e,f],[g,h,k]]=M;const dt=a*(e*k-f*h)-b*(d*k-f*g)+c*(d*h-e*g);if(Math.abs(dt)<1e-12)return null;return[[(e*k-f*h)/dt,(c*h-b*k)/dt,(b*f-c*e)/dt],[(f*g-d*k)/dt,(a*k-c*g)/dt,(c*d-a*f)/dt],[(d*h-e*g)/dt,(b*g-a*h)/dt,(a*e-b*d)/dt]];}
function applyH(H,x,y){const w=H[2][0]*x+H[2][1]*y+H[2][2];return{x:(H[0][0]*x+H[0][1]*y+H[0][2])/w,y:(H[1][0]*x+H[1][1]*y+H[1][2])/w};}
function warpPerspective(idata,sw,sh,corners,S){
  const src4=[corners.tl,corners.tr,corners.br,corners.bl];
  const dst4=[{x:0,y:0},{x:S-1,y:0},{x:S-1,y:S-1},{x:0,y:S-1}];
  const H=computeH(src4,dst4);if(!H)return null;
  const Hi=inv3(H);if(!Hi)return null;
  const out=new ImageData(S,S),sd=idata.data,od=out.data;
  for(let dy=0;dy<S;dy++)for(let dx=0;dx<S;dx++){
    const p=applyH(Hi,dx,dy);const x0=p.x|0,y0=p.y|0,x1=x0+1,y1=y0+1,fx=p.x-x0,fy=p.y-y0;
    const di=(dy*S+dx)*4;const get=(sx,sy,c)=>(sx<0||sx>=sw||sy<0||sy>=sh)?128:sd[(sy*sw+sx)*4+c];
    for(let c=0;c<3;c++)od[di+c]=Math.round(get(x0,y0,c)*(1-fx)*(1-fy)+get(x1,y0,c)*fx*(1-fy)+get(x0,y1,c)*(1-fx)*fy+get(x1,y1,c)*fx*fy);od[di+3]=255;}
  return out;}
function verifyZebra(wGray,S,minContrast){
  function scanLine(arr){const n=arr.length;let mn=255,mx=0;for(const v of arr){if(v<mn)mn=v;if(v>mx)mx=v;}if(mx-mn<minContrast)return null;const thr=(mn+mx)>>1,runs=[];let cur=arr[0]>thr?1:0,len=1;for(let i=1;i<n;i++){const b=arr[i]>thr?1:0;if(b===cur)len++;else{runs.push({v:cur,len});cur=b;len=1;}}runs.push({v:cur,len});if(runs.length<3)return null;const allLens=runs.map(r=>r.len).sort((a,b)=>a-b);const med=allLens[allLens.length>>1];if(med<2)return null;const valid=runs.filter(r=>r.len>=med*0.4&&r.len<=med*2.4);if(valid.length<5)return null;let T=valid.length;if(T%2===0){if(valid[0].v===1||valid[T-1].v===1)T+=1;else return null;}if(T<5)return null;return{T,modSize:S/T};}
  const probeOffsets=[2,5,10,15,20,30];const votes=new Map();let totalProbes=0;
  for(const off of probeOffsets){if(off>=S/2)continue;for(const pos of[off,S-1-off]){const row=new Uint8Array(S);for(let x=0;x<S;x++)row[x]=wGray[pos*S+x];const rh=scanLine(row);if(rh)votes.set(rh.T,(votes.get(rh.T)||0)+1);totalProbes++;const col=new Uint8Array(S);for(let y=0;y<S;y++)col[y]=wGray[y*S+pos];const rv=scanLine(col);if(rv)votes.set(rv.T,(votes.get(rv.T)||0)+1);totalProbes++;}}
  if(!votes.size)return null;let bestT=0,bestV=0;for(const[t,v]of votes)if(v>bestV){bestV=v;bestT=t;}
  return{T:bestT,modSize:S/bestT,confidence:bestV/totalProbes};}
function countT(wGray,S){
  function s2(arr){const n=arr.length;let mn=255,mx=0;for(const v of arr){if(v<mn)mn=v;if(v>mx)mx=v;}const contrast=mx-mn,thr=(mn+mx)>>1,runs=[];let cur=arr[0]>thr?1:0,len=1;for(let i=1;i<n;i++){const b=arr[i]>thr?1:0;if(b===cur)len++;else{runs.push({v:cur,len});cur=b;len=1;}}runs.push({v:cur,len});const allLens=runs.map(r=>r.len).sort((a,b)=>a-b),med=allLens[allLens.length>>1];const valid=runs.filter(r=>r.len>=med*0.4&&r.len<=med*2.4);return{T:valid.length,contrast};}
  const offsets=[2,5,8,12,18];const votes=new Map();
  for(const off of offsets){if(off>=S/2)continue;for(const pos of[off,S-1-off]){const row=new Uint8Array(S);for(let x=0;x<S;x++)row[x]=wGray[pos*S+x];const r=s2(row);if(r.contrast>=40&&r.T>=3){let T=r.T;if(T%2===0)T++;votes.set(T,(votes.get(T)||0)+1);}const col=new Uint8Array(S);for(let y=0;y<S;y++)col[y]=wGray[y*S+pos];const rc=s2(col);if(rc.contrast>=40&&rc.T>=3){let T=rc.T;if(T%2===0)T++;votes.set(T,(votes.get(T)||0)+1);}}}
  let bestT=0,bestV=0;for(const[t,v]of votes)if(v>bestV){bestV=v;bestT=t;}return bestT;}
function detectZebra(wGray,S,minContrast){
  const resA=verifyZebra(wGray,S,minContrast),tA=resA?resA.T:0,tB=countT(wGray,S);
  Li('verifyZebra: T='+tA+(resA?' conf='+(resA.confidence*100).toFixed(0)+'%':''));
  Li('countT:      T='+tB);
  let T=0;
  if(tA>0&&tB>0)T=(resA.confidence>=0.5)?tA:tB;else if(tA>0)T=tA;else if(tB>0)T=tB;
  if(T<1)return null;
  return{T,modSize:S/T,confidence:resA?resA.confidence:0};}

function sampleCircles(warped,S,T,modSize){
  const d=warped.data,circleR=modSize*0.28,r2=circleR*circleR,cells=[];
  for(let row=1;row<T-1;row++)for(let col=1;col<T-1;col++){
    const cx=col*modSize+modSize/2,cy=row*modSize+modSize/2;
    let sumR=0,sumG=0,sumB=0,cnt=0;
    const x0=Math.max(0,Math.floor(cx-circleR)),x1=Math.min(S-1,Math.ceil(cx+circleR));
    const y0=Math.max(0,Math.floor(cy-circleR)),y1=Math.min(S-1,Math.ceil(cy+circleR));
    for(let py=y0;py<=y1;py++)for(let px=x0;px<=x1;px++){const dx=px-cx,dy=py-cy;if(dx*dx+dy*dy>r2)continue;const idx=(py*S+px)*4;sumR+=d[idx];sumG+=d[idx+1];sumB+=d[idx+2];cnt++;}
    if(cnt===0){cells.push({r:0,g:0,b:0,row,col});continue;}
    cells.push({r:sumR/cnt,g:sumG/cnt,b:sumB/cnt,row,col});}
  return{cells,circleR};}

// ═══════════════════════════════════════════════════════
//  PIPELINE з логами
// ═══════════════════════════════════════════════════════

function pipeline(idata,w,h){
  const gray=toGray(idata,w,h);
  const bg=sampleBG(gray,w,h,5);
  Li('BG luma: '+bg);

  Lh('1. МАСКА + КУТИ');
  const tols=[20,30,42,55,70,90];let bestCorners=null,bestSpread=0,bestTol=0;
  for(const tol of tols){
    const rm=makeMask(gray,w,h,bg,tol),em=erodeMask(rm,w,h);
    const fgN=em.reduce((s,v)=>s+v,0);
    if(fgN<50){Li('tol='+tol+' FG='+fgN+' — пропуск');continue;}
    const c=findCorners(em,w,h,15),sp=spread(c);
    Li('tol='+tol+' FG='+fgN+' spread='+Math.round(sp)+'px TL('+c.tl.x+','+c.tl.y+') BR('+c.br.x+','+c.br.y+')');
    if(sp>bestSpread){bestSpread=sp;bestCorners=c;bestTol=tol;}}

  // fallback variance
  if(!bestCorners||bestSpread<30){
    Lw('Маска слабка — variance scan');
    const topRows=[],leftCols=[];
    for(let y=0;y<h;y++){let sum=0,sum2=0;for(let x=0;x<w;x++){const v=gray[y*w+x];sum+=v;sum2+=v*v;}const avg=sum/w,std=Math.sqrt(sum2/w-avg*avg);if(std>50)topRows.push(y);}
    for(let x=0;x<w;x++){let sum=0,sum2=0;for(let y=0;y<h;y++){const v=gray[y*w+x];sum+=v;sum2+=v*v;}const avg=sum/h,std=Math.sqrt(sum2/h-avg*avg);if(std>50)leftCols.push(x);}
    topRows.sort((a,b)=>a-b);leftCols.sort((a,b)=>a-b);
    if(topRows.length>0&&leftCols.length>0){
      const vc={tl:{x:leftCols[0],y:topRows[0]},tr:{x:leftCols[leftCols.length-1],y:topRows[0]},br:{x:leftCols[leftCols.length-1],y:topRows[topRows.length-1]},bl:{x:leftCols[0],y:topRows[topRows.length-1]}};
      const vsp=spread(vc);Li('Variance: spread='+Math.round(vsp)+'px');
      if(vsp>bestSpread){bestCorners=vc;bestSpread=vsp;bestTol='variance';}}}

  if(!bestCorners||bestSpread<20){Le('Рамку не знайдено (spread='+Math.round(bestSpread)+')');return{ok:false,idata,w,h};}
  Lok('Рамка знайдена tol='+bestTol+' spread='+Math.round(bestSpread)+'px');

  const expand=6;
  const corners={tl:{x:bestCorners.tl.x-expand,y:bestCorners.tl.y-expand},tr:{x:bestCorners.tr.x+expand,y:bestCorners.tr.y-expand},br:{x:bestCorners.br.x+expand,y:bestCorners.br.y+expand},bl:{x:bestCorners.bl.x-expand,y:bestCorners.bl.y+expand}};

  Lh('2. ПЕРСПЕКТИВНА КОРЕКЦІЯ');
  const S=600;
  const warped=warpPerspective(idata,w,h,corners,S);
  if(!warped){Le('Гомографія не вдалася');return{ok:false,corners,idata,w,h};}
  Lok('Warp → '+S+'×'+S);

  Lh('3. ВЕРИФІКАЦІЯ ЗЕБРИ');
  const wGray=toGray({data:warped.data},S,S);
  const zebra=detectZebra(wGray,S,50);
  if(!zebra){Le('Зебру не знайдено');return{ok:false,corners,idata,w,h,warped,S};}
  Lok('T='+zebra.T+'  modSize='+zebra.modSize.toFixed(1)+'px  conf='+(zebra.confidence*100).toFixed(0)+'%');

  Lh('4. СІТКА + КРУЖЕЧКИ');
  const circles=sampleCircles(warped,S,zebra.T,zebra.modSize);
  Li('Клітинок: '+circles.cells.length+'  ('+( zebra.T-2)+'×'+(zebra.T-2)+' внутрішніх)');
  Li('Радіус: '+circles.circleR.toFixed(1)+'px');

  // Статистика яскравості
  const lumas=circles.cells.map(c=>(c.r+c.g+c.b)/3);
  const lumaMin=Math.min(...lumas),lumaMax=Math.max(...lumas);
  const lumaMed=[...lumas].sort((a,b)=>a-b)[lumas.length>>1];
  const autoThr=(lumaMin+lumaMax)/2;
  Li('Яскравість: min='+lumaMin.toFixed(0)+' med='+lumaMed.toFixed(0)+' max='+lumaMax.toFixed(0));
  Li('Авто-поріг: '+autoThr.toFixed(0));

  // Насиченість
  const sats=circles.cells.map(c=>Math.max(c.r,c.g,c.b)-Math.min(c.r,c.g,c.b));
  const medSat=[...sats].sort((a,b)=>a-b)[sats.length>>1];
  const coloredCount=sats.filter(s=>s>60).length;
  const isColored=medSat>25||coloredCount>=Math.max(3,circles.cells.length*0.15);
  Li('Насиченість медіана='+medSat.toFixed(0)+' кольорових='+coloredCount+' → '+(isColored?'КОЛІР':'МОНО'));

  return{ok:true,corners,idata,w,h,warped,S,zebra,circles,autoThr,isColored};}

// ═══════════════════════════════════════════════════════
//  ВІЗУАЛІЗАЦІЯ
// ═══════════════════════════════════════════════════════

function visualize(result,idata,w,h){
  // Кадр + рамка
  const ctx2=cvAnalysis.getContext('2d');
  if(result.corners){
    const c=result.corners;
    ctx2.strokeStyle='#55eb5a';ctx2.lineWidth=2;
    ctx2.beginPath();ctx2.moveTo(c.tl.x,c.tl.y);ctx2.lineTo(c.tr.x,c.tr.y);ctx2.lineTo(c.br.x,c.br.y);ctx2.lineTo(c.bl.x,c.bl.y);ctx2.closePath();ctx2.stroke();
    for(const pt of[c.tl,c.tr,c.br,c.bl]){ctx2.fillStyle='#ffdd33';ctx2.beginPath();ctx2.arc(pt.x,pt.y,5,0,Math.PI*2);ctx2.fill();}
    if(!result.ok){setSt('рамка є, зебра не знайдена',false);}
  } else {
    setSt('рамку не знайдено',false);
  }

  if(!result.ok){
    cvWarp.width=300;cvWarp.height=300;cvWarp.getContext('2d').fillStyle='#111';cvWarp.getContext('2d').fillRect(0,0,300,300);
    cvGrid.width=300;cvGrid.height=300;cvGrid.getContext('2d').fillStyle='#111';cvGrid.getContext('2d').fillRect(0,0,300,300);
    return;}

  // Варп
  cvWarp.width=result.S;cvWarp.height=result.S;
  cvWarp.getContext('2d').putImageData(result.warped,0,0);

  // Сітка + кружечки
  const S=result.S,{T,modSize}=result.zebra;
  cvGrid.width=S;cvGrid.height=S;
  const gc=cvGrid.getContext('2d');
  gc.putImageData(result.warped,0,0);

  // Тонка сітка
  gc.strokeStyle='rgba(40,120,200,0.25)';gc.lineWidth=0.7;
  for(let i=0;i<=T;i++){const p=i*modSize;gc.beginPath();gc.moveTo(p,0);gc.lineTo(p,S);gc.stroke();gc.beginPath();gc.moveTo(0,p);gc.lineTo(S,p);gc.stroke();}

  // Зебра-рамка підсвітка
  for(let i=0;i<T;i++){const isB=(i%2===0);gc.fillStyle=isB?'rgba(255,80,80,0.18)':'rgba(80,180,255,0.10)';gc.fillRect(i*modSize,0,modSize,modSize);gc.fillRect(i*modSize,S-modSize,modSize,modSize);if(i>0&&i<T-1){gc.fillRect(0,i*modSize,modSize,modSize);gc.fillRect(S-modSize,i*modSize,modSize,modSize);}}

  // Кутові маркери
  gc.fillStyle='rgba(255,220,50,0.40)';
  gc.fillRect(0,0,modSize,modSize);gc.fillRect(S-modSize,0,modSize,modSize);gc.fillRect(S-modSize,S-modSize,modSize,modSize);gc.fillRect(0,S-modSize,modSize,modSize);

  // Внутрішня рамка
  gc.strokeStyle='rgba(80,235,120,0.6)';gc.lineWidth=1.5;
  gc.strokeRect(modSize,modSize,(T-2)*modSize,(T-2)*modSize);

  // Кружечки — колір залежить від значення пікселя
  const circleR=modSize*0.28;
  if(result.circles){
    for(const cell of result.circles.cells){
      const cx=cell.col*modSize+modSize/2,cy=cell.row*modSize+modSize/2;
      const L=(cell.r+cell.g+cell.b)/3;
      const bit=L>result.autoThr?1:0;
      // Колір кружечка: зелений=1 (одиниця), темний=0 (нуль)
      if(result.isColored){
        gc.strokeStyle=`rgb(${Math.round(cell.r)},${Math.round(cell.g)},${Math.round(cell.b)})`;
        gc.lineWidth=Math.max(1,modSize*0.08);
      } else {
        gc.strokeStyle=bit?'rgba(80,235,120,0.9)':'rgba(255,80,80,0.5)';
        gc.lineWidth=Math.max(1,modSize*0.07);
      }
      gc.beginPath();gc.arc(cx,cy,circleR,0,Math.PI*2);gc.stroke();}}

  setSt('✓ T='+T+'  mod='+modSize.toFixed(1)+'px  '+(result.isColored?'КОЛІР':'МОНО'),true);
  Lok('Готово');}
</script>
